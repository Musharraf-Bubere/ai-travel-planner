services:

  api:
    build: .
    container_name: ai-travel-planner-api
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/travel_planner
    depends_on:
      db:
        condition: service_healthy

  streamlit:
    build: .
    container_name: ai-travel-planner-streamlit
    command: streamlit run streamlit_app/app.py --server.address=0.0.0.0 --server.port=8501
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      API_URL: http://api:8000/plan
    depends_on:
      - api

  db:
    image: postgres:16
    container_name: ai-travel-planner-db
    environment:
      POSTGRES_DB: travel_planner
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d travel_planner"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
